server:
  port: ${PC_LAB_SERVER_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: pc-lab-hardware-platform
  datasource:
    url: ${PC_LAB_DB_URL:jdbc:mysql://127.0.0.1:3306/pc_lab_3d?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PC_LAB_DB_USERNAME:root}
    password: ${PC_LAB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${PC_LAB_REDIS_HOST:127.0.0.1}
      port: ${PC_LAB_REDIS_PORT:6379}
      password: ${PC_LAB_REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 10s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${PC_LAB_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    admin-key: ${PC_LAB_ADMIN_KEY:}
    public-rate-limit-per-minute: ${PC_LAB_PUBLIC_RATE_LIMIT:120}
    admin-rate-limit-per-minute: ${PC_LAB_ADMIN_RATE_LIMIT:60}
  storage:
    model-root: ${PC_LAB_MODEL_ROOT:./storage/models}
    public-prefix: ${PC_LAB_MODEL_PUBLIC_PREFIX:/assets/models}
  price:
    mode: ${PC_LAB_PRICE_MODE:MANUAL}
    manual-adapter-enabled: ${PC_LAB_MANUAL_ADAPTER_ENABLED:true}
    jd:
      enabled: ${PC_LAB_JD_ALLIANCE_ENABLED:false}
      app-key: ${PC_LAB_JD_ALLIANCE_APP_KEY:}
      app-secret: ${PC_LAB_JD_ALLIANCE_APP_SECRET:}
    taobao:
      enabled: ${PC_LAB_TAOBAO_ALLIANCE_ENABLED:false}
      app-key: ${PC_LAB_TAOBAO_ALLIANCE_APP_KEY:}
      app-secret: ${PC_LAB_TAOBAO_ALLIANCE_APP_SECRET:}
    pdd:
      enabled: ${PC_LAB_PDD_OPEN_PLATFORM_ENABLED:false}
      app-key: ${PC_LAB_PDD_OPEN_PLATFORM_APP_KEY:}
      app-secret: ${PC_LAB_PDD_OPEN_PLATFORM_APP_SECRET:}
    scheduler-enabled: ${PC_LAB_PRICE_SCHEDULER_ENABLED:true}
    hot-refresh-cron: ${PC_LAB_PRICE_HOT_CRON:0 15 * * * *}
    normal-refresh-cron: ${PC_LAB_PRICE_NORMAL_CRON:0 30 3 * * *}
    analytics-hash-key: ${PC_LAB_ANALYTICS_HASH_KEY:pc-lab-local-development-key}
    redirect-hosts:
      JD:
        - jd.com
      TAOBAO:
        - taobao.com
      PDD:
        - yangkeduo.com
      TMALL:
        - tmall.com
      AMAZON:
        - amazon.cn
      SUNING:
        - suning.com
  ai:
    timeout-millis: ${PC_LAB_AI_TIMEOUT_MILLIS:6000}
    analytics-hash-key: ${PC_LAB_AI_ANALYTICS_HASH_KEY:pc-lab-ai-local-development-key}
    model:
      enabled: ${PC_LAB_AI_MODEL_ENABLED:false}
      base-url: ${PC_LAB_AI_MODEL_BASE_URL:https://api.openai.com}
      api-key: ${PC_LAB_AI_MODEL_API_KEY:}
      name: ${PC_LAB_AI_MODEL_NAME:}
      embedding-name: ${PC_LAB_AI_EMBEDDING_MODEL:text-embedding-3-small}
      max-output-tokens: ${PC_LAB_AI_MAX_OUTPUT_TOKENS:800}
      temperature: ${PC_LAB_AI_TEMPERATURE:0.1}
      estimated-tokens-per-request: ${PC_LAB_AI_ESTIMATED_TOKENS:1200}
      daily-token-budget: ${PC_LAB_AI_DAILY_TOKEN_BUDGET:50000}
    vector:
      enabled: ${PC_LAB_AI_VECTOR_ENABLED:false}
      base-url: ${PC_LAB_AI_VECTOR_BASE_URL:http://127.0.0.1:8000}
      token: ${PC_LAB_AI_VECTOR_TOKEN:}
      tenant: ${PC_LAB_AI_VECTOR_TENANT:default_tenant}
      database: ${PC_LAB_AI_VECTOR_DATABASE:default_database}
      collection-id: ${PC_LAB_AI_VECTOR_COLLECTION_ID:}
